name = "barnabas-chat"
main = "worker.js"
compatibility_date = "2026-08-01"
# @anthropic-ai/sdk's internal credential-chain code references Node
# built-ins (node:fs, node:path) that only exist under this flag — without
# it, wrangler deploy warns and the Worker risks a runtime error if that
# code path is ever hit, even though our own code only uses the static
# apiKey option, not those credential features.
compatibility_flags = ["nodejs_compat"]

# Created by `npx wrangler kv namespace create RATE_LIMIT_KV` — replace the
# id below with the one it prints. See README.md.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "01335b7ed00748b49d04c41a096da98c"
