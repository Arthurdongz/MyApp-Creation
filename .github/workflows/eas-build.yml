name: EAS Build & Submit

# Manual only — unlike eas-update.yml (which auto-publishes JS-only OTA
# updates on every push under mobile/**), a native build costs real EAS
# build minutes and, when submitted, kicks off an actual App Store/Play
# Store review. That should always be a deliberate, on-demand action, never
# something that fires automatically off a push.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "ios"
        type: choice
        options:
          - ios
          - android
          - all
      profile:
        description: "EAS build profile (see mobile/eas.json)"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
          - development
      submit:
        description: "Submit the finished build to the store (production profile only)"
        required: true
        default: false
        type: boolean
      sync_release:
        description: "Skip building; instead re-upload the named profile's latest finished Android build to the GitHub Release matching app.json's version (fixes a release whose APK predates a later fix, without spending build minutes)"
        required: true
        default: false
        type: boolean

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.sync_release }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Waits for the remote EAS build to finish (eas-cli's default) so the
      # submit step below only ever runs against a build that actually
      # succeeded — never fires against a still-running or failed build.
      - name: Build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive

      # eas.json only defines a "production" submit profile today, so this
      # is gated to that profile regardless of what the submit input says.
      # Android submission additionally needs a Google Play service-account
      # key configured via `eas credentials` beforehand — this step will
      # fail fast if that hasn't been set up, without affecting the build
      # that already succeeded above.
      - name: Submit to store
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        run: eas submit --platform ${{ inputs.platform }} --profile production --non-interactive --latest

  sync_release:
    if: ${{ inputs.sync_release }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Find latest finished Android build for this profile
        run: |
          BUILD_JSON=$(eas build:list --platform android --profile "${{ inputs.profile }}" --status finished --limit 1 --non-interactive --json)
          node -e "
            const build = JSON.parse(process.argv[1])[0];
            if (!build) { console.error('No finished Android build found for profile ${{ inputs.profile }}.'); process.exit(1); }
            const url = build.artifacts && build.artifacts.buildUrl;
            if (!url) { console.error('Build ' + build.id + ' has no downloadable artifact.'); process.exit(1); }
            console.log('BUILD_ID=' + build.id);
            console.log('APP_VERSION=' + build.appVersion);
            console.log('ARTIFACT_URL=' + url);
          " "$BUILD_JSON" >> "$GITHUB_ENV"

      - name: Download APK
        run: curl -fL -o barnabas-journal.apk "$ARTIFACT_URL"

      - name: Upload to matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}"
          echo "Syncing build $BUILD_ID (app version $APP_VERSION) to release $TAG"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" barnabas-journal.apk --clobber --repo "${{ github.repository }}"
            echo "::notice::Uploaded $BUILD_ID's APK to release $TAG"
          else
            echo "::error::No GitHub Release found for tag $TAG — create it first, then re-run this workflow."
            exit 1
          fi
