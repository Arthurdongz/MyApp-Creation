name: Sync GitHub Release APK

# On-demand only. eas-build.yml already builds and (optionally) submits —
# this workflow doesn't build anything itself. It just takes whatever the
# most recent finished Android EAS build already is and republishes it as
# the download asset on the matching GitHub Release (tag v<app.json
# version>), so the release doesn't go stale pointing at an APK built
# before some later fix. Kept separate from eas-build.yml so re-syncing
# the release never costs EAS build minutes or triggers a new build.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile to pull the latest finished Android build from"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
          - development

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Find latest finished Android build and download its artifact
        run: |
          BUILD_JSON=$(eas build:list --platform android --profile "${{ inputs.profile }}" --status finished --limit 1 --non-interactive --json)
          node -e "
            const build = JSON.parse(process.argv[1])[0];
            if (!build) { console.error('No finished Android build found for profile ${{ inputs.profile }}.'); process.exit(1); }
            const url = build.artifacts && build.artifacts.buildUrl;
            if (!url) { console.error('Build ' + build.id + ' has no downloadable artifact.'); process.exit(1); }
            console.log('BUILD_ID=' + build.id);
            console.log('APP_VERSION=' + build.appVersion);
            console.log('ARTIFACT_URL=' + url);
          " "$BUILD_JSON" >> "$GITHUB_ENV"

      - name: Download APK
        run: curl -fL -o barnabas-journal.apk "$ARTIFACT_URL"

      - name: Upload to matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}"
          echo "Syncing build $BUILD_ID (app version $APP_VERSION) to release $TAG"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" barnabas-journal.apk --clobber --repo "${{ github.repository }}"
            echo "::notice::Uploaded $BUILD_ID's APK to release $TAG"
          else
            echo "::error::No GitHub Release found for tag $TAG — create it first, then re-run this workflow."
            exit 1
          fi
