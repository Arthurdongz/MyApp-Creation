name: Publish EAS Update

on:
  push:
    branches:
      - claude/barnabas-journal-app-xxz25d
    paths:
      - "mobile/**"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update to preview and production channels
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT="$(printf '%s' "$COMMIT_MESSAGE" | head -n1)"
          if [ -z "$SUBJECT" ]; then
            SUBJECT="Manual update ($(git rev-parse --short HEAD))"
          fi
          eas update --branch preview --message "$SUBJECT" --non-interactive
          eas update --branch production --message "$SUBJECT" --non-interactive
